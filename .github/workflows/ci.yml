name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (R ${{ matrix.r-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.3", "4.4", "release"]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      # The samplers need only base R and MASS, which ships with R. The test
      # suite adds `posterior` for the convergence diagnostics it checks, and
      # the analysis stage needs the plotting and table packages.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior
            any::ggplot2
            any::dplyr
            any::tidyr
            any::knitr
            any::scales

      # Every script must at least parse. The benchmark scripts cannot run
      # here, since stage 1 pulls reference posteriors from GitHub and stage 2
      # takes hours, so this catches syntax errors in the files the test suite
      # does not source.
      - name: Parse every script
        run: |
          Rscript -e '
            files <- list.files(".", pattern = "[.]R$", recursive = TRUE)
            failed <- character(0)
            for (f in files) {
              ok <- tryCatch({ parse(f); TRUE }, error = function(e) {
                cat(f, ":", conditionMessage(e), "\n"); FALSE
              })
              if (!ok) failed <- c(failed, f)
            }
            if (length(failed)) quit(status = 1)
            cat("all", length(files), "scripts parse\n")
          '

      - name: Run tests
        run: Rscript tests/run_tests.R
